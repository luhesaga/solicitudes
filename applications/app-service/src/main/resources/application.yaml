server:
  port: 8081
spring:
  application:
    name: "solicitudes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    host: "localhost"
    port: 5432
    database: "solicitudes_db"
    schema: "public"
    username: "postgres"
    password: "App$2025"
    pool:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
jwt:
  secret: "EsteEsUnSecretoSuperLargoYComplejoParaMiAplicacionCrediYaNoCompartir"
  expiration:
    ms: 86400000
adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080"
adapters:
  restconsumer:
    url:
      # La URL base donde corre tu microservicio de autenticacion
      autenticacion: http://localhost:8080
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
