server:
  port: "${SERVER_PORT}"
spring:
  application:
    name: "solicitudes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    host: "${ADAPTERS_R2DBC_HOST}"
    port: 5432
    database: "${ADAPTERS_R2DBC_DATABASE}"
    schema: "public"
    username: "${ADAPTERS_R2DBC_USERNAME}"
    password: "${ADAPTERS_R2DBC_PASSWORD}"
    ssl: true
    ssl-mode: "require"
    pool:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
jwt:
  secret: ${JWT_SECRET}
  expiration:
    ms: ${JWT_EXPIRATION_MS} # 24 horas
adapter:
  restconsumer:
    timeout: 5000
    url: "${ADAPTERS_RESTCONSUMER_URL_AUTENTICACION:http://localhost:8080}"
  sqs:
    region: "us-east-1"
    queueUrl: ${AWS_QUEUE_URL}
    # endpoint: "http://localhost:4566"
    accessKey: ${AWS_ACCESS_KEY_ID}
    secretKey: ${AWS_SECRET_ACCESS_KEY}
adapters:
  restconsumer:
    url:
      autenticacion: "${ADAPTERS_RESTCONSUMER_URL_AUTENTICACION:http://localhost:8080}"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
